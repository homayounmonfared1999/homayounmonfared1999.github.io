<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="app-version" content="2.0.0" />
    <title>ادیتز اپدیت شد</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="frame">
      <div class="content">
        <div class="badge">Update</div>
        <h1 class="title">🍏ادیتز اپدیت شد🍏</h1>

        <div class="version-box">
          <span>نسخه</span>
          <span class="version-value" id="versionValue">2.0.0</span>
        </div>

        <a
          class="cta"
          id="downloadLink"
          href="https://t.me/EditzApps"
          target="_blank"
          rel="noopener noreferrer"
        >
          دانلود نسخه جدید
        </a>

        <div class="status">بررسی نسخه و آپدیت جدید</div>
      </div>
    </div>

    <script>
      // =========================
      // تنظیمات صفحه - فقط در اینجا تغییر دهید
      // =========================
                  const appConfig = {
        title: "🍏ادیتز اپدیت شد🍏",,
        version: "2.0.0",,
        downloadUrl: "https://t.me/EditzApps",,
        buttonText: "دانلود نسخه جدید",,
        badgeText: "Update",,
        subtitle: "بررسی نسخه و آپدیت جدید",,
        fontFamily: "'Vazirmatn', sans-serif",,
        textSize: 16,,
        titleSize: 20,,
        background: "#040810",,
        accent: "#7ce4ff",,
        accent2: "#9cffb3",
      };

      // =========================
      // اعمال تنظیمات روی صفحه
      // =========================
      function applyConfig() {
        const titleEl = document.querySelector(".title");
        const versionEl = document.getElementById("versionValue");
        const linkEl = document.getElementById("downloadLink");
        const badgeEl = document.querySelector(".badge");
        const statusEl = document.querySelector(".status");
        const metaEl = document.querySelector('meta[name="app-version"]');

        if (titleEl) titleEl.textContent = appConfig.title;
        if (versionEl) versionEl.textContent = appConfig.version;
        if (linkEl) {
          linkEl.href = appConfig.downloadUrl;
          linkEl.textContent = appConfig.buttonText;
          linkEl.setAttribute("aria-label", appConfig.buttonText);
        }
        if (badgeEl) badgeEl.textContent = appConfig.badgeText;
        if (statusEl) statusEl.textContent = appConfig.subtitle;
        if (metaEl) metaEl.setAttribute("content", appConfig.version);

        document.title = appConfig.title;
        document.body.style.fontFamily = appConfig.fontFamily;
        document.body.style.fontSize = `${appConfig.textSize}px`;
        if (titleEl) titleEl.style.fontSize = `${appConfig.titleSize}px`;

        document.documentElement.style.setProperty("--bg-dark", appConfig.background);
        document.documentElement.style.setProperty("--accent", appConfig.accent);
        document.documentElement.style.setProperty("--accent-2", appConfig.accent2);
      }

      document.addEventListener("DOMContentLoaded", applyConfig);
    </script>
  </body>
</html>
