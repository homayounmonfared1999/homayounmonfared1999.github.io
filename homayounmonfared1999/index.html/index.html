        :root {

            color: #ffffff;
            font-family: var(--font-family);

            display: flex;
            flex-direction: column;

            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .badge {
            background: rgba(124, 228, 255, 0.15);
            border: 1px solid var(--accent-color);

            border-radius: 50px;

            border-radius: 28px;
            text-decoration: none;
            font-weight: bold;

            box-shadow: 0 0 20px rgba(124, 228, 255, 0.4);

            margin-bottom: 20px;
        }

        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(124, 228, 255, 0.7);
